// RFTools 1.12（悠然服务器修改版）的构建，取代原来的 ForgeGradle 2.3 + Gradle 2.7。
//
// 运行 Gradle 需要 JDK 25（RetroFuturaGradle 2.x 插件是 Java 25 字节码）；编译目标是 Java 8，
// 编译用的 JDK 8 由工具链（foojay）自动下载，本机已有时用本机的。
// 产物 build/libs/rftools-<version>.jar（version 取 gradle.properties，形如 1.12-7.73）。

plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}

group = 'com.github.mcjty'
def mcVer = property('minecraft_version').toString()

base {
    archivesName.set('rftools')
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.AZUL)
    }
    withSourcesJar()
}

minecraft {
    mcVersion.set(mcVer)
    // Forge 版本由 RetroFuturaGradle 固定为 14.23.5.2847；映射照原构建
    mcpMappingChannel.set(property('mcp_mappings_channel').toString())
    mcpMappingVersion.set(property('mcp_mappings_version').toString())
    username.set('Developer')
}

// 访问转换器（AT）：开发环境的 Minecraft 反编译源里要先放开这些成员，编译才过；
// 运行时靠 jar 清单里的 FMLAT 由 Forge 加载
tasks.named('deobfuscateMergedJarToSrg') {
    accessTransformerFiles.from(file('src/main/resources/META-INF/rftools_at.cfg'))
}
tasks.named('srgifyBinpatchedJar') {
    accessTransformerFiles.from(file('src/main/resources/META-INF/rftools_at.cfg'))
}

repositories {
    maven {
        // JEI
        name 'BlameJared Maven'
        url 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        // McJtyLib、InteractionWheel、XNet
        name 'McJty Maven'
        url 'https://maven.k-4u.nl'
        content {
            includeGroup 'com.github.mcjty'
        }
    }
    maven {
        // 红石通量（RedstoneFlux）
        name 'covers1624 Maven'
        url 'https://maven.covers1624.net'
        content {
            includeGroup 'cofh'
        }
    }
    maven {
        // OpenComputers 的 API
        name 'OC Maven'
        url 'https://maven.cil.li'
        content {
            includeGroup 'li.cil.oc'
        }
    }
    maven {
        // Tesla
        name 'ModMaven'
        url 'https://modmaven.dev'
        content {
            includeGroup 'net.darkhax.tesla'
        }
    }
    maven {
        // Hwyla（Waila）：原来的 tehnut.info 已经不能用，用 BuildCraft 作者给兼容模组准备的镜像
        name 'Hwyla 镜像'
        url 'https://alexiil.uk/mirrors/for_buildcraft_compat/maven'
        content {
            includeGroup 'mcp.mobius.waila'
        }
    }
    exclusiveContent {
        // The One Probe：原来的 tterrag maven 上已经没有，改用 Modrinth 上同版本号（1.12-1.4.20）的 jar
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        // SpongeAPI（只编译）：有 SpongeForge 时用 Sponge 的事件问领地保护插件（见 protection.Protection）
        name 'Sponge'
        url 'https://repo.spongepowered.org/repository/maven-public/'
        content {
            includeGroup 'org.spongepowered'
            includeGroup 'com.flowpowered'
        }
    }
    mavenCentral {
        content {
            excludeGroup 'org.spongepowered'
            excludeGroup 'com.flowpowered'
        }
    }
}

dependencies {
    // 必需：JEI、McJtyLib（运行时都要有）
    implementation "mezz.jei:jei_${property('jei_version')}"
    implementation(rfg.deobf("com.github.mcjty:mcjtylib:${property('mcjtylib_version')}")) {
        // mcjtylib 的 pom 带着 OpenComputers 的 API（版本范围 MC1.12.1-1.7.+）；下面单独以只编译的方式引入
        transitive = false
    }

    // 以下都是可选兼容（原构建里也是编译依赖，jar 里不打包），只编译，不进开发环境的运行时
    compileOnly rfg.deobf("com.github.mcjty:intwheel:${property('intwheel_version')}")
    compileOnly rfg.deobf("com.github.mcjty:xnet:${property('xnet_version')}")
    compileOnly rfg.deobf("maven.modrinth:the-one-probe:${property('top_version')}")
    compileOnly rfg.deobf("mcp.mobius.waila:Hwyla:${property('waila_version')}:api")
    compileOnly rfg.deobf("cofh:RedstoneFlux:${property('redstoneflux_version')}:universal")
    compileOnly rfg.deobf("net.darkhax.tesla:Tesla-1.12.2:${property('tesla_version')}")
    compileOnly rfg.deobf("li.cil.oc:OpenComputers:${property('oc_version')}:api")

    // SpongeAPI 7.4.0（与 SpongeForge 7.4.7 对应）：只编译、不打包；运行时由 SpongeForge 提供，没有 Sponge 时相关类不会被加载
    compileOnly('org.spongepowered:spongeapi:7.4.0') { transitive = false }
    compileOnly('com.flowpowered:flow-math:1.0.3') { transitive = false }

    // 单元测试（只测纯逻辑：范围、白名单、预算、上限、映射清理）
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Minecraft 的日志配置会在工作目录下建 logs/，放到 build 里
    workingDir = layout.buildDirectory.dir('test-work').get().asFile
    doFirst { workingDir.mkdirs() }
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.AZUL
    })
}

jar {
    manifest {
        attributes 'FMLAT': 'rftools_at.cfg'
    }
}

processResources {
    // mcmod.info 里的 ${version}、${mcversion}
    inputs.property 'version', project.version
    inputs.property 'mcversion', mcVer
    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': mcVer
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
